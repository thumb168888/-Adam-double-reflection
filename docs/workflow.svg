<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">圖表反射的三個步驟</title>
  <desc id="desc">選擇圖片，拖曳選取區域，預覽旋轉一百八十度的結果。</desc>
  <rect width="960" height="280" rx="20" fill="#101c2b"/>
  <g font-family="sans-serif" fill="#f2f5f9" font-size="24" text-anchor="middle">
    <text x="160" y="53">① 選擇圖片</text>
    <text x="480" y="53">② 拖曳圖表範圍</text>
    <text x="800" y="53">③ 預覽旋轉結果</text>
  </g>
  <g fill="#1b3044" stroke="#5bc7b0" stroke-width="2">
    <rect x="50" y="80" width="220" height="150" rx="8"/>
    <rect x="370" y="80" width="220" height="150" rx="8"/>
    <rect x="690" y="80" width="220" height="150" rx="8"/>
  </g>
  <g fill="none" stroke="#88bee0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 180 L105 156 L143 167 L180 119 L225 130 L251 101"/>
    <path d="M388 180 L425 156 L463 167 L500 119 L545 130 L571 101"/>
    <path d="M690 159 L698 150 L743 161 L780 113 L818 124 L833 114"/>
  </g>
  <rect x="410" y="110" width="143" height="90" fill="none" stroke="#f6bd60" stroke-width="3" stroke-dasharray="7 5"/>
  <g font-family="sans-serif" fill="#5bc7b0" font-size="32" text-anchor="middle">
    <text x="320" y="162">→</text><text x="640" y="162">→</text>
  </g>
  <text x="800" y="257" fill="#bdc8d3" font-family="sans-serif" font-size="16" text-anchor="middle">僅是影像旋轉，並非走勢預測</text>
</svg>
